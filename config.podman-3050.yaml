# Laptop: Fedora + Podman, RTX 3050 (compose.podman-3050.yml). Różnice względem config.yaml:
#  - Qdrant pod nazwą usługi z compose (qdrant), nie localhost,
#  - mniejsze paczki przy ingeście - dostrojone pod laptopowy RTX 3050 (4 GB VRAM),
#  - bez LLM: odpowiedzią są najlepiej pasujące fragmenty źródeł.
# Plik jest montowany do kontenera: zmiana = podman compose -f compose.podman-3050.yml restart docrag.

qdrant:
  url: http://qdrant:6333
  api_key: null
  collection: docs
  upsert_batch: 64

embedding:
  backend: bge-m3
  model: BAAI/bge-m3
  device: cuda:0
  use_fp16: true                 # RTX 3050 (sm_86, Ampere): fp16 działa
  batch_size: 8                  # 16 na RTX 5070; mniej = mniejszy szczyt VRAM przy ingeście
  max_length: 8192
  passage_prefix: ""

chunking:
  max_tokens: 700
  min_tokens: 80
  overlap_sentences: 1
  parent_max_tokens: 4000
  use_model_tokenizer: true

legal:
  skip_repealed: true
  drop_footnotes: true

defaults:
  doc_type: dokument
  acl: [all]

search:
  prefetch_limit: 40
  rerank_candidates: 40          # mniej = szybciej (reranker to ~90% czasu zapytania)
  top_k: 5
  reranker: bge                  # none = bez rerankera (oszczędza ok. 1,1 GB VRAM)
  reranker_model: BAAI/bge-reranker-v2-m3
  reranker_device: cuda:0
  reranker_fp16: true
  reranker_batch_size: 8
  reranker_max_length: 1024
  min_score: 0.0
  expand_parents: true
  max_refs: 3
  context_max_tokens: 6000

llm:
  # Ollama na komputerze z RTX 5070 w sieci lokalnej (laptop nie ma własnego LLM).
  # Wyłączony komputer = po connect_timeout odpowiedź samymi źródłami zamiast błędu.
  backend: ollama                # none = zawsze same źródła
  url: http://192.168.10.187:11434   # IP komputera z Ollamą (ipconfig); najlepiej stałe (rezerwacja DHCP)
  model: gemma4-docrag           # Modelfile.gemma4, założony na tamtym komputerze
  temperature: 0.1
  num_ctx: 8192
  num_predict: 1024
  think: false
  timeout: 300
  connect_timeout: 5

api:
  # local:  logowanie loginem i hasłem; konta zakłada admin: docrag user add <login> [--admin]
  # header: użytkownik/grupy AD z nagłówków od reverse proxy (IIS/nginx + Kerberos/OIDC);
  #         wtedy API wystawiaj tylko przez proxy, inaczej nagłówki da się podrobić
  # none:   bez logowania - każdy widzi tylko dokumenty z acl "all" i nie może wgrywać
  auth: local
  user_header: X-Remote-User
  groups_header: X-Remote-Groups
  groups_separator: ","
  admin_users: []                # tryb header: loginy administratorów
  db_path: /app/state/docrag.db           # SQLite: użytkownicy, sesje, rejestr dokumentów
  upload_dir: /app/state/uploads          # wgrane pliki (podkatalog na użytkownika)
  max_upload_mb: 50
  session_hours: 168             # ważność logowania (7 dni)
  cookie_secure: false           # true, gdy serwer jest za HTTPS
  cors_origins: []               # np. [http://localhost:5173] dla frontendu w trybie dev
  max_question_chars: 2000
  warmup: true
