# Laptop: Fedora + Podman, RTX 3050 (4 GB VRAM). Qdrant + docrag (API, frontend, modele na GPU).
# LLM: Ollama na komputerze z RTX 5070 w sieci lokalnej (config.podman-3050.yaml, sekcja llm). Konfiguracja: config.podman-3050.yaml
# (Windows + Docker Desktop + RTX 5070: compose.windows-5070.yml)
#
#   podman compose -f compose.podman-3050.yml up -d --build      # -> http://127.0.0.1:8008 (nie localhost)
#   podman compose -f compose.podman-3050.yml logs -f docrag
#   podman compose -f compose.podman-3050.yml run --rm docrag docrag ingest data/
#   podman compose -f compose.podman-3050.yml exec docrag docrag user add admin --admin   # pierwsze konto
#
# GPU przez CDI: sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml (raz, po instalacji
# sterownika i nvidia-container-toolkit). :Z = etykieta SELinux dla montowanego folderu.
name: docrag

services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.19.2   # ta sama wersja co przy tworzeniu qdrant_storage
    restart: always                          # podman-restart.service wznawia po restarcie systemu
    ports:
      - "6333:6333"                          # REST + dashboard (http://127.0.0.1:6333/dashboard)
    volumes:
      - ./qdrant_storage:/qdrant/storage:Z

  docrag:
    build: .
    image: localhost/docrag:latest
    restart: always
    depends_on:
      - qdrant
    ports:
      - "8008:8008"                          # frontend + API
    environment:
      DOCRAG_CONFIG: /app/config.yaml
    devices:
      - nvidia.com/gpu=all                   # CDI
    security_opt:
      - label=disable                        # SELinux: dostęp kontenera do urządzeń GPU
    volumes:
      - ./config.podman-3050.yaml:/app/config.yaml:ro,Z
      - ./data:/app/data:ro,Z                # dokumenty do ingestu przez CLI
      - ./state:/app/state:Z                 # SQLite (użytkownicy, sesje) + pliki wgrane przez stronę
      - hf-cache:/models                     # modele BGE-M3 i reranker (~4,6 GB, pobierane raz)

volumes:
  hf-cache:
